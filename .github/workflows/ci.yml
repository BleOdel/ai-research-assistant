# CI for the framework itself: LaTeX smoke compile, skill/command lint, CLI
# typechecks and tests.
#
# Deliberately NOT here: live smoke tests of the connector CLIs against the real
# arXiv / Semantic Scholar / Google Scholar (SerpApi) / OpenAlex APIs. CI runs
# typechecks and the checked-in fixture test suites only - network-flaky, Semantic
# Scholar's unauthenticated pool is rate limited, google-scholar-search requires a
# paid account's API key CI does not have, and OpenAlex's free daily allowance is
# small enough that CI runs would compete with real usage. Live connector testing
# stays a local, on-demand step.
#
# Security posture: this repo ships pre-approved Claude Code permissions and CLI
# code that every fork user executes, so the security-guards job fails PRs that
# widen settings.json permissions, weaken the personal-data gitignore rules, or add
# package lifecycle scripts. Actions are pinned to commit SHAs; the token is
# read-only.

name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint skills, commands, settings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python tools/lint_skills.py

  security-guards:
    name: Security guards (permissions, gitignore, manifests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python tools/security_guards.py

  python-tests:
    name: Python tool tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -t . -v

  latex-smoke:
    name: Compile example report
    runs-on: ubuntu-latest
    container: texlive/texlive:latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Compile report (4-pass pdflatex + bibtex sequence)
        run: |
          cd report
          pdflatex -interaction=nonstopmode report_example.tex
          bibtex report_example
          pdflatex -interaction=nonstopmode report_example.tex
          pdflatex -interaction=nonstopmode report_example.tex
          test -f report_example.pdf
          if grep -q '^!' report_example.log; then
            echo '::error::pdflatex reported errors compiling report/report_example.tex'
            grep -A3 '^!' report_example.log
            exit 1
          fi
          if grep -qi 'undefined\|(author?)' report_example.log; then
            echo '::error::natbib citation resolution failed - check citation style matches natbib package options (see 04-citation-rules.md)'
            grep -i 'undefined' report_example.log
            exit 1
          fi

  cli-checks:
    name: CLI checks ${{ matrix.tool }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tool:
          - arxiv-search
          - semantic-scholar-search
          - google-scholar-search
          - openalex-search
          - paper-fetch
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install
        working-directory: .agents/skills/${{ matrix.tool }}/cli
      - run: bun run typecheck
        working-directory: .agents/skills/${{ matrix.tool }}/cli
      - name: Run fixture/mock tests when present
        run: |
          if find tests -type f -name '*.test.ts' | grep -q .; then
            bun test
          else
            echo "No Bun tests found for ${{ matrix.tool }}; skipping"
          fi
        working-directory: .agents/skills/${{ matrix.tool }}/cli
